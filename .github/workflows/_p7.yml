name: P7 combined action v2
on:
  push:
    branches: [claude/release-npm-oidc-mzsb3z]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - uses: changesets/action@v2
        with:
          github-token: ${{ secrets.PAT_GITHUB }}
          publish-script: yarn release
          version-script: yarn changeset version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: false
          push-git-tags: false
