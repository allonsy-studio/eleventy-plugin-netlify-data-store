name: Release

on:
  push:
    branches:
      - main

# One release at a time; a later push waits instead of cancelling a publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # The OIDC token npm exchanges for a short-lived publish credential.
      id-token: write

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Use Node LTS version
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Must follow setup-node: enabling Corepack first leaves the shim on the
      # pre-installed Node.
      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dependencies
        run: yarn install --immutable

      # No npm token: `opx release publish` publishes with npm, which exchanges
      # the Actions OIDC token for a short-lived credential. npm must list this
      # workflow as a trusted publisher for the package.
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: yarn run version
          publish: yarn release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          commitMode: github-api
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
