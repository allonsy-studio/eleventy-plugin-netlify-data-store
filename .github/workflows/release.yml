name: Release

on:
  push:
    branches:
      - main

# Scoped on the job instead; nothing else in this workflow needs a token.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # Version commits, git tags & the GitHub release.
      contents: write
      # The release PR.
      pull-requests: write
      # The OIDC token npm exchanges for a short-lived publish credential.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node LTS version
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Must follow setup-node: enabling Corepack first leaves the shim on the
      # pre-installed Node.
      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dependencies
        run: yarn install --immutable

      # Opens the release PR while changesets are pending, publishes once one
      # merges. No npm token: Yarn exchanges the Actions OIDC token with npm
      # for a short-lived credential, so npm must list this workflow as a
      # trusted publisher for the package.
      #
      # Deliberately not the select-mode/version/publish sub-actions: those
      # declare `main: ../dist/*.js`, which climbs out of their own action
      # directory, and GitHub rejects the workflow outright with a
      # startup_failure at every ref.
      - name: Create release PR or publish to npm
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.PAT_GITHUB }}
          publish-script: yarn release
          version-script: yarn changeset version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
